<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vanguard Voice | Dedicated Native-English Reception & Support Teams</title>
  <meta name="description" content="Scale your business with pre-vetted, native-English remote receptionists and appointment setters aligned with North American & UK hours—at up to 60% less than local hiring." />
  <link rel="icon" type="image/jpeg" href="IMG_e7d452ea-c503-4d83-836b-a24abe7fbf35.jpg" />
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy-dark: #08101E;
      --navy: #0D192B;
      --navy-light: #162640;
      --gold: #D4AF37;
      --gold-light: #E8C967;
      --gold-dim: rgba(212, 175, 55, 0.15);
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --border: rgba(212, 175, 55, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--navy-dark);
      color: var(--text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Navigation */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8, 16, 30, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 76px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-main);
    }

    .brand img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1.5px solid var(--gold);
      object-fit: cover;
    }

    .brand-text {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .brand-text span {
      color: var(--gold);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--gold);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }

    .btn-gold {
      background: linear-gradient(135deg, var(--gold), #B89028);
      color: #08101E;
      box-shadow: 0 4px 16px rgba(212, 175, 55, 0.25);
    }

    .btn-gold:hover {
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      transform: translateY(-1px);
    }

    .btn-outline {
      background: transparent;
      color: var(--gold);
      border: 1.5px solid var(--gold);
    }

    .btn-outline:hover {
      background: var(--gold-dim);
    }

    /* Hero */
    .hero {
      padding: 84px 0 72px;
      background: radial-gradient(circle at top right, rgba(212, 175, 55, 0.08), transparent 55%),
                  linear-gradient(180deg, var(--navy) 0%, var(--navy-dark) 100%);
      border-bottom: 1px solid var(--border);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 48px;
      align-items: center;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: var(--gold-dim);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--gold-light);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.1rem, 4vw, 3.2rem);
      line-height: 1.15;
      margin-bottom: 20px;
      color: #FFFFFF;
    }

    h1 span {
      color: var(--gold);
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 32px;
      max-width: 580px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 36px;
    }

    .trust-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .trust-strip strong {
      color: var(--gold-light);
    }

    .hero-card {
      background: var(--navy-light);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .hero-card img {
      width: 136px;
      height: 136px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      object-fit: cover;
      margin-bottom: 20px;
    }

    .hero-card h3 {
      font-size: 1.2rem;
      margin-bottom: 8px;
      color: #FFFFFF;
    }

    .hero-card p {
      font-size: 0.92rem;
      margin-bottom: 20px;
    }

    .stat-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      background: var(--navy-dark);
      padding: 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .stat-num {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--gold);
    }

    .stat-label {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* Sections */
    section {
      padding: 80px 0;
    }

    .section-header {
      text-align: center;
      max-width: 680px;
      margin: 0 auto 52px;
    }

    .section-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 3vw, 2.4rem);
      margin-bottom: 12px;
      color: #FFFFFF;
    }

    .section-header p {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .card {
      background: var(--navy);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--gold);
    }

    .card-tag {
      display: inline-block;
      color: var(--gold);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .card h3 {
      font-size: 1.2rem;
      margin-bottom: 12px;
      color: #FFFFFF;
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Comparison Table */
    .alt-bg {
      background: var(--navy);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .table-wrap {
      overflow-x: auto;
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--navy-dark);
      text-align: left;
    }

    th, td {
      padding: 18px 22px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }

    th {
      background: var(--navy-light);
      color: var(--gold-light);
      font-weight: 600;
    }

    td.highlight {
      color: #FFFFFF;
      font-weight: 600;
      background: rgba(212, 175, 55, 0.05);
    }

    /* CTA Banner */
    .cta-box {
      background: linear-gradient(135deg, var(--navy-light), var(--navy));
      border: 1.5px solid var(--gold);
      border-radius: 18px;
      padding: 52px 32px;
      text-align: center;
      max-width: 880px;
      margin: 0 auto;
    }

    .cta-box h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.75rem, 3vw, 2.3rem);
      margin-bottom: 14px;
      color: #FFFFFF;
    }

    .cta-box p {
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto 28px;
    }

    .email-pill {
      display: inline-block;
      margin-top: 18px;
      padding: 10px 18px;
      background: var(--navy-dark);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--gold-light);
      font-weight: 500;
      text-decoration: none;
    }

    .email-pill:hover {
      border-color: var(--gold);
    }

    /* Footer */
    footer {
      padding: 36px 0;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    footer a {
      color: var(--gold);
      text-decoration: none;
    }

    @media (max-width: 860px) {
      .hero-grid, .grid-3 {
        grid-template-columns: 1fr;
      }
      .nav-links a:not(.btn) {
        display: none;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="container nav-inner">
      <a href="#" class="brand">
        <img src="IMG_e7d452ea-c503-4d83-836b-a24abe7fbf35.jpg" alt="Vanguard Voice Logo" onerror="this.style.display='none'">
        <div class="brand-text">VANGUARD <span>VOICE</span></div>
      </a>
      <nav class="nav-links">
        <a href="#services">Services</a>
        <a href="#why-us">Why Us</a>
        <a href="#process">How It Works</a>
        <a href="#contact" class="btn btn-gold">Book a Call</a>
      </nav>
    </div>
  </header>

  <section class="hero">
